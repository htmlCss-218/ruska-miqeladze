<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="reserv.css">
  <title>Reservation Form SPHERE</title>
</head>
<body>
    <header>
        <p id="title">
            MAKE A RESERVATION
        </p>
    </header>
<main>
  <div class="container">
    <div class="header">
      
      <h1>SPHÈRE</h1>
    </div>
    <p class="thank-you">Thank you for choosing the <span class="highlight">Sphère</span> Paris 8th restaurant! </p>
    <form>
      <div class="form-group">
        <label for="covers"> cutlery</label>
        <select id="covers">
          <option>cutlery</option>
          <option>1 cutlery</option>
          <option>2 cutlery</option>
          <option>3 cutlery</option>

        </select>
      </div>
      <div class="form-group">
        <label for="date">today</label>
        <select id="date">
            <option>today</option>
          <option>tomorrow</option>
          <option>the day after that</option>
        </select>
      </div>
      <div class="form-group">
        <label for="time">hourly</label>
        <select id="time">
          <option>hourly</option>
          <option> 1 hour</option>
          <option>2 hour</option>
          <option>3 hour</option>
        </select>
      </div>
      <button type="button">
       Reserve </button>
    </form>
  </main>
    <footer>
      <p>Rendu possible par Zenchef
        Reserve a table<br>
sphere restaurant paris plat DSC0544 1200x800 - La Carte du Restaurant 4food<br>
sphere restaurant paris plat D
      </p>
    </footer>
  </div>
</body>
</html>
